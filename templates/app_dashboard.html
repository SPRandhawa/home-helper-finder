{% extends 'base.html' %}

{% block title %}{{ heading }} | Home Helper Finder{% endblock %}

{% block content %}
<section class="max-w-4xl py-10">
    <p class="text-sm font-bold uppercase tracking-[0.2em] text-green">{{ eyebrow }}</p>
    <h1 class="mt-3 text-4xl font-black text-navy">{{ heading }}</h1>
    <p class="mt-5 max-w-2xl text-lg text-slate-600">{{ intro }}</p>

    <div class="mt-8 flex flex-wrap gap-3">
        {% for action in actions %}
        <a href="{% url action.url_name %}" class="rounded-lg bg-green px-5 py-3 font-bold text-white hover:bg-green-dark">
            {{ action.label }}
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
