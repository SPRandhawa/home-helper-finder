{% extends 'base.html' %}

{% block title %}{{ heading }} | Home Helper Finder{% endblock %}

{% block content %}
<section class="max-w-4xl mx-auto py-10">
    <p class="text-sm font-bold uppercase tracking-[0.2em] text-green">{{ eyebrow }}</p>
    <h1 class="mt-3 text-4xl font-black tracking-tight text-navy md:text-5xl">{{ heading }}</h1>
    <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-600">{{ intro }}</p>
    <div class="mt-10 grid gap-4 sm:grid-cols-2">
        {% for action in actions %}
        <a href="{% url action.url_name %}" class="group rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:border-green hover:shadow-lg">
            <span class="text-lg font-bold text-navy group-hover:text-green">{{ action.label }}</span>
            <span class="mt-3 block text-sm text-slate-500">Continue to this area <i class="fa-solid fa-arrow-right ml-1"></i></span>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
