<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block dashboard_title %}Dashboard{% endblock %} | Home Helper Finder</title>
    {% block dashboard_head %}{% endblock %}
</head>
<body>
    <header>
        <a href="{% url 'pages:home' %}">Home Helper Finder</a>
        <nav aria-label="Website navigation">
            <a href="{% url 'pages:home' %}">Home</a>
            <a href="{% url 'pages:about' %}">About Us</a>
            <a href="{% url 'pages:help' %}">Help Guide</a>
            <a href="{% url 'pages:contact' %}">Contact</a>
            {% block dashboard_navigation %}{% endblock %}
        </nav>
    </header>
    <main>
        {% block dashboard_content %}{% endblock %}
    </main>
    <footer>
        <a href="{% url 'pages:privacy' %}">Privacy Policy</a>
        <a href="{% url 'pages:terms' %}">Terms &amp; Conditions</a>
    </footer>
</body>
</html>
